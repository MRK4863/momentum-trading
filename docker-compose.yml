version: '3.8'

services:
  momentum-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: momentum-trading-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Optional: Mount local files for development
    # volumes:
    #   - ./momentum_dashboard.py:/app/momentum_dashboard.py
    #   - ./METADATA.csv:/app/METADATA.csv
